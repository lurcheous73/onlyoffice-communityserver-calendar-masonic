#
# Brimstone Cottage Calendar Location loader
#

location = /brimstone-calendar-location.js {
    alias /var/www/onlyoffice/Data/brimstone/brimstone-calendar-location.js;

    default_type application/javascript;
    charset utf-8;

    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    access_log off;
}

location = /brimstone-calendar-masonic.js { alias /var/www/onlyoffice/Data/brimstone/brimstone-calendar-masonic.js; default_type application/javascript; charset utf-8; add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always; access_log off; }
sub_filter_once on;
sub_filter '</body>' '<script src="/brimstone-calendar-location.js?v=20260714-1"></script><script src="/brimstone-calendar-masonic.js?v=20260718-1"></script></body>';
